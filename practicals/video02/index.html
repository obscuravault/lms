<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Practical 02</title>
	<style>
		body,
		html {
			margin: 0;
			padding: 0;
			height: 100%;
			background-color: #000;
			color: white;
		}

		#video-container {
			position: relative;
			width: 100%;
			height: 100%;
			display: none;
		}

		#player {
			width: 100%;
			height: 100%;
			pointer-events: none;
		}

		#watermark {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: rgba(255, 255, 255, 0.7);
			font-size: 48px;
			font-weight: bold;
			font-family: Arial, sans-serif;
			pointer-events: none;
		}

		#fullscreenButton {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			padding: 12px 30px;
			font-size: 18px;
			background: linear-gradient(90deg, #00ffff, #00ff88, #0066ff);
			color: white;
			font-weight: bold;
			border: none;
			border-radius: 12px;
			cursor: pointer;
			z-index: 10;
			box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
			animation: glow 4s linear infinite;
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		#fullscreenButton:hover {
			transform: translate(-50%, -60%);
			box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
		}

		@keyframes glow {
			0% {
				box-shadow: 0 0 10px #00fff0, 0 0 20px #00ff88, 0 0 30px #0066ff;
			}
			50% {
				box-shadow: 0 0 15px #00ff88, 0 0 25px #ff00ff, 0 0 35px #00ffff;
			}
			100% {
				box-shadow: 0 0 10px #00fff0, 0 0 20px #00ff88, 0 0 30px #0066ff;
			}
		}

		#progress-bar-container {
			position: absolute;
			bottom: 20px;
			left: 0;
			width: 100%;
			height: 10px;
			background: rgba(255, 255, 255, 0.3);
			cursor: pointer;
		}

		#progress-bar {
			height: 100%;
			background: #4CAF50;
			width: 0%;
		}

		#time-display {
			position: absolute;
			bottom: 40px;
			right: 20px;
			font-size: 14px;
			color: white;
			z-index: 10;
		}

		#customPlayButton {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-size: 60px;
			color: white;
			background: rgba(0, 0, 0, 0.5);
			border: none;
			border-radius: 50%;
			width: 80px;
			height: 80px;
			cursor: pointer;
			z-index: 11;
			display: none;
		}

		* {
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}
	</style>
    <script>
    const redirectURL = "https://google.com"; // Set your redirect URL here

	let devtoolsOpen = false;
	const element = new Image();
	Object.defineProperty(element, 'id', {
		get: function () {
			devtoolsOpen = true;
			throw new Error("DevTools detected");
		}
	});

	function detectDevToolsLoop() {
		setInterval(() => {
			devtoolsOpen = false;
			console.dir(element);
			if (devtoolsOpen || isDevToolsOpen()) {
				window.location.replace(redirectURL);
			}
		}, 1000);
	}

	function isDevToolsOpen() {
		const threshold = 160;
		return (
			window.outerWidth - window.innerWidth > threshold ||
			window.outerHeight - window.innerHeight > threshold
		);
	}

	detectDevToolsLoop();

	document.addEventListener("keydown", function (e) {
		if (
			e.key === "F12" ||
			(e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) ||
			(e.ctrlKey && e.key === "U")
		) {
			e.preventDefault();
			window.location.replace(redirectURL);
		}
	});
    </script>
</head>

<body>
	<button id="fullscreenButton">ACCESS VIDEO</button>
	<div id="video-container">
		<iframe id="player" src="https://www.youtube.com/embed/Wb9W5B8zc9k?enablejsapi=1&autohide=1&modestbranding=1&rel=0&showinfo=0&controls=0&iv_load_policy=3&fs=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
		<button id="customPlayButton">▶</button>
		<div id="watermark">Obscura Vault</div>
		<div id="progress-bar-container">
			<div id="progress-bar"></div>
		</div>
		<div id="time-display">0:00 / 0:00</div>
	</div>

	<script>
		let player;
		const fullscreenButton = document.getElementById('fullscreenButton');
		const progressBar = document.getElementById('progress-bar');
		const progressBarContainer = document.getElementById('progress-bar-container');
		const timeDisplay = document.getElementById('time-display');
		const customPlayButton = document.getElementById('customPlayButton');
		let isFullscreen = false;

		function onYouTubeIframeAPIReady() {
			player = new YT.Player('player', {
				events: {
					'onReady': onPlayerReady,
					'onStateChange': onPlayerStateChange
				}
			});
		}

		function onPlayerReady(event) {
			player.setVolume(100);
		}

		function onPlayerStateChange(event) {
			if (event.data == YT.PlayerState.PLAYING) {
				setInterval(updateProgressBar, 1000);
			}
		}

		function updateProgressBar() {
			const currentTime = player.getCurrentTime();
			const duration = player.getDuration();
			const progressPercentage = (currentTime / duration) * 100;
			const formattedTime = formatTime(currentTime);
			const formattedDuration = formatTime(duration);

			progressBar.style.width = progressPercentage + '%';
			timeDisplay.textContent = `${formattedTime} / ${formattedDuration}`;
		}

		function formatTime(seconds) {
			const minutes = Math.floor(seconds / 60);
			const remainingSeconds = Math.floor(seconds % 60);
			return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
		}

		fullscreenButton.addEventListener('click', function () {
			openFullscreen();
		});

		customPlayButton.addEventListener('click', () => {
			player.playVideo();
			customPlayButton.style.display = 'none';
		});

		function openFullscreen() {
			if (document.documentElement.requestFullscreen) {
				document.documentElement.requestFullscreen();
			} else if (document.documentElement.mozRequestFullScreen) {
				document.documentElement.mozRequestFullScreen();
			} else if (document.documentElement.webkitRequestFullscreen) {
				document.documentElement.webkitRequestFullscreen();
			} else if (document.documentElement.msRequestFullscreen) {
				document.documentElement.msRequestFullscreen();
			}

			isFullscreen = true;
			document.getElementById('video-container').style.display = 'block';
			fullscreenButton.style.display = 'none';
			customPlayButton.style.display = 'block';
		}

		function onFullscreenChange() {
			if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
				player.pauseVideo();
				document.getElementById('video-container').style.display = 'none';
				fullscreenButton.style.display = 'block';
				customPlayButton.style.display = 'none';
				isFullscreen = false;
			}
		}

		document.getElementById('video-container').addEventListener('contextmenu', function (event) {
			event.preventDefault();
		});

		document.addEventListener('fullscreenchange', onFullscreenChange);
		document.addEventListener('mozfullscreenchange', onFullscreenChange);
		document.addEventListener('webkitfullscreenchange', onFullscreenChange);

		progressBarContainer.addEventListener('click', function (event) {
			const rect = progressBarContainer.getBoundingClientRect();
			const clickPosition = event.clientX - rect.left;
			const clickPercentage = (clickPosition / rect.width) * 100;
			const newTime = (clickPercentage / 100) * player.getDuration();
			player.seekTo(newTime);
		});
	
</script>


	<script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
