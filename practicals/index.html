<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Practical Videos</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: #1e1e1e;
			font-family: 'Poppins', sans-serif;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			color: white;
		}

		.glow-box {
			position: relative;
			width: 400px;
			padding: 40px 30px;
			border-radius: 20px;
			background: #1f1f1f;
			box-shadow: 0 0 20px rgba(0, 255, 255, 0.2),
			0 0 30px rgba(0, 255, 0, 0.2),
			0 0 40px rgba(0, 0, 255, 0.2);
			animation: glow 5s linear infinite;
			display: flex;
			flex-direction: column;
			gap: 20px;
			align-items: center;
			text-align: center;
		}

		@keyframes glow {
			0% {
				box-shadow: 0 0 20px #00fff0,
				0 0 30px #00ff88,
				0 0 40px #0066ff;
			}
			50% {
				box-shadow: 0 0 20px #00ff88,
				0 0 30px #ff00ff,
				0 0 40px #00ffff;
			}
			100% {
				box-shadow: 0 0 20px #00fff0,
				0 0 30px #00ff88,
				0 0 40px #0066ff;
			}
		}

		.glow-box h2 {
			font-size: 24px;
			background: linear-gradient(90deg, #00fff0, #00ff88, #0066ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 10px;
		}

		.glow-box p {
			font-size: 14px;
			background: linear-gradient(90deg, #00ffff, #ff00ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-top: 10px;
		}

		.glow-box button {
			padding: 12px 24px;
			font-size: 16px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(90deg, #00ffff, #00ff88, #0066ff);
			color: white;
            font-weight:bold;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
			width: 100%;
		}

		.glow-box button:hover {
			transform: translateY(-6px);
			box-shadow: 0 4px 12px rgba(0, 255, 255, 0.4);
		}
	</style>
</head>

<body>

	<div class="glow-box">
		<h2>ACCESS THE VIDEOS </h2>

	<button onclick="location.href='video01/'">ඔප දැමූ කැලරිමීටරයක් භාවිතයෙන් වාතයේ සාපේක්ෂ ආර්ද්‍රතාව සෙවීම.</button>
    <button onclick="location.href='video02/'">නිව්ටන්ගේ සිසිලන නියමය සත්‍යාපනය කිරීම සහ ඒ ඇසුරෙන් විශිෂ්ට තාප ධාරිතාව නොදන්නා ද්‍රවයක විශිෂ්ට තාප ධාරිතාව සෙවීම</button>
    <p> For Nugegoda and Kurunegala Students✨</p>
  </div>

</body>
<script>
	const redirectURL = "https://google.com"; // Change to your desired URL

	let devtoolsOpen = false;
	const detector = new Image();
	Object.defineProperty(detector, 'id', {
		get: function () {
			devtoolsOpen = true;
			throw new Error("DevTools detected");
		}
	});

	function detectDevToolsLoop() {
		setInterval(() => {
			devtoolsOpen = false;
			console.dir(detector);
			if (devtoolsOpen || isDevToolsOpen()) {
				if (redirectURL) window.location.replace(redirectURL);
			}
		}, 1000);
	}

	function isDevToolsOpen() {
		const threshold = 160;
		return (
			window.outerWidth - window.innerWidth > threshold ||
			window.outerHeight - window.innerHeight > threshold
		);
	}

	document.addEventListener("keydown", function (e) {
		if (
			e.key === "F12" ||
			(e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
			(e.ctrlKey && e.key === "U")
		) {
			e.preventDefault();
			if (redirectURL) window.location.replace(redirectURL);
		}
	});

	document.addEventListener("contextmenu", function (e) {
		e.preventDefault();
	});

	detectDevToolsLoop();
</script>



</html>
